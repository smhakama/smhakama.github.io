<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etoru — ちいさなパズルを作っています</title>
<meta name="description" content="Android 向けのちいさなパズルゲームを作っています。">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 5rem;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.9; color: #2b2320; background: #fbf7f0;
  }
  h1 { font-size: 2rem; letter-spacing: .08em; margin: 0 0 .3rem; }
  .lead { opacity: .75; margin: 0 0 3rem; }
  .card {
    border: 1px solid #e0d5c6; border-radius: 14px;
    padding: 1.5rem 1.6rem; background: #fffdf9;
  }
  .card h2 { font-size: 1.3rem; margin: 0 0 .2rem; }
  .card .sub { opacity: .7; font-size: .9rem; margin: 0 0 1rem; }
  ul { padding-left: 1.2rem; margin: 0; }
  li { margin: .35rem 0; }
  .status {
    display: inline-block; font-size: .8rem; padding: .15rem .7rem;
    border-radius: 999px; background: #ead9c8; color: #6b4c34; margin-left: .5rem;
    vertical-align: middle;
  }
  footer { margin-top: 4rem; font-size: .85rem; opacity: .6; }
  @media (prefers-color-scheme: dark) {
    body { color: #ece5dc; background: #1a1512; }
    .card { background: #221b17; border-color: #3d332c; }
    .status { background: #3d2f24; color: #e8c9a8; }
  }
</style>
</head>
<body>

<h1>etoru</h1>
<p class="lead">Android 向けのちいさなパズルゲームを作っています。</p>

<div class="card">
  <h2>ねこ迷惑ニャ<span class="status">準備中</span></h2>
  <p class="sub">じゃまな駒をずらして、ねこを出口へ。</p>
  <ul>
    <li>全 305 面。すべて無料で遊べます</li>
    <li>最短 2 手から、最長 40 手まで</li>
    <li>時間制限なし・ライフなし・スタミナなし</li>
    <li>オフラインで遊べます</li>
  </ul>
</div>

<footer>
  <p>© 2026 etoru</p>
</footer>

</body>
</html>
